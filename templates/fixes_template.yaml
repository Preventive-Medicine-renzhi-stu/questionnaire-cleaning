# ============================================================
#  qc_apply.R 修正指令模板
#  用法: Rscript qc_apply.R 数据.sav -f 本文件.yaml -o 输出目录
#
#  ⚠️ 重要原则：只写【已确认正确值】的修正。
#     凡是需要回查原始问卷才能确定的（异常值、矛盾答案、漏填），
#     不要写进这里 —— 留给人工核对，本文件只负责执行确定的事。
# ============================================================

dataset: 问卷名称

fixes:

  # ---- 类型 1：改值（有唯一正确答案的笔误）----
  - id: recordda_year
    type: set_value
    column: RECORDDA
    desc: "录入日期年份误写为 2004，应为 2024"
    rows: [222, 223, 224]          # 或用 where 表达式（见下）
    value: "2024-06-03"

  # 用表达式圈定行（与 rows 二选一；两者都给时以 rows 为准）
  - id: id2_typo
    type: set_value
    column: ID2
    desc: "第 1832 行 ID2 与 ID1 不符，按 ID1 修正"
    where: "!is.na(ID1) & !is.na(ID2) & ID1 != ID2 & ID1 == 41338"
    value: 41338

  # ---- 类型 2：置为缺失 ----
  # 用于「这条记录的值确定是错的，但又不知道正确值」的情况 ——
  # 置缺失比留错值安全（分析时可被 missing 处理机制识别）
  - id: bad_height_to_na
    type: set_na
    column: HEIGHT
    desc: "身高 100cm 明显为录入错误，无原始记录，置缺失"
    rows: [3582]

  # ---- 类型 3：新增列（不改原值，只加标记）----
  # 混合单位 / 分组标记这类，推荐用新增列而不是改原值
  - id: weight_unit_flag
    type: add_column
    column: WEIGHT_unit
    desc: "标记体重单位：确认这 137 行是公斤，其余为斤"
    default: "斤"
    rows: [64, 127, 182]           # 这里应填完整的 137 行行号
    value: "kg"

  # ---- 类型 4：批量改变量名 ----
  # 仅改名，不动数据。注意：qc_apply.R 导出 .sav 时还会自动处理
  # SPSS 不合法的名字，并生成映射表，通常不需要在这里手工改。
  - id: rename_map
    type: rename_columns
    desc: "统一命名风格"
    map:
      量表评分（总计）: 量表评分_总计
      实际睡眠时间（未填补）: 实际睡眠时间_未填补
